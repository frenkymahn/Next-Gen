name: Build Xiaomi 11T Pro Safe Boot Image (Next-Gen)

on:
  workflow_dispatch:
    inputs:
      stock_boot_url:
        description: "Direct URL to your current working HyperOS boot.img"
        required: true
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip device-tree-compiler

      - name: Fetch Clang Toolchain
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r487747c.git clang

      - name: Fetch Kernel Source Code
        run: |
          rm -rf kernel
          git clone --depth=1 https://github.com/frenkymahn/Next-Gen.git kernel

      - name: Run Compilation Process with Next-Gen Name
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          BUILD_FLAGS="ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 KCFLAGS=-Wno-error -Wno-unknown-warning-option -Wno-ignored-optimization-argument"
          
          make O=out $BUILD_FLAGS vili_defconfig

          # Set Kernel Name to Next-Gen
          scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-Next-Gen"

          # Bypass SELinux strict rules on Port ROM
          scripts/config --file out/.config --enable CONFIG_ALWAYS_PERMISSIVE
          scripts/config --file out/.config --disable CONFIG_SECURITY_SELINUX_DEVELOP

          # Compile Kernel Image and DTBs
          make -j$(nproc --all) O=out $BUILD_FLAGS
          make -j$(nproc --all) O=out $BUILD_FLAGS dtbs

      - name: Repack Original Boot Image with Next-Gen Kernel Binary
        run: |
          mkdir -p work_repack output_boot
          cd work_repack

          # Download MagiskBoot tool
          wget -qO magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot

          # Download your ROM's stock working boot.img
          curl -sL "${{ github.event.inputs.stock_boot_url }}" -o stock_boot.img

          # Unpack stock boot.img to preserve its ramdisk, dtb and headers
          ./magiskboot unpack stock_boot.img

          # Replace kernel with the compiled Next-Gen binary
          if [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz kernel
          else
            cp ../kernel/out/arch/arm64/boot/Image kernel
          fi

          # Repack into a flashable boot.img
          ./magiskboot repack stock_boot.img ../output_boot/boot.img
          cd ..

      - name: Upload Next-Gen Boot Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-NextGen-Boot
          path: output_boot/boot.img
