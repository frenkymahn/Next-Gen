name: Build Xiaomi 11T Pro Custom Kernel

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Environment & Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libcrypto++-dev u-boot-tools git zip unzip libncurses5-dev ccache device-tree-compiler

      - name: Fetch Target HyperOS Clang Toolchain (Official AOSP Source)
        run: |
          # Fetch directly from verified Google AOSP source to bypass broken repo links
          mkdir clang
          cd clang
          git clone --depth=1 https://googlesource.com -b main
          
          # Locate the target r530567 binary folder path dynamically
          if [ -d clang-r530567 ]; then
            echo "$(pwd)/clang-r530567/bin" >> $GITHUB_PATH
          elif [ -d linux-x86/clang-r530567 ]; then
            echo "$(pwd)/linux-x86/clang-r530567/bin" >> $GITHUB_PATH
          else
            # Workaround fallback if nested inside subfolders
            TARGET_PATH=$(find $(pwd) -type d -name "bin" | grep "r530567")
            echo "$TARGET_PATH" >> $GITHUB_PATH
          fi
          cd ..

      - name: Checkout Device Kernel Tree (Normal Source Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Apply Defconfig Parameters for HyperOS Specific Core
        run: |
          # Check folder structural layouts cleanly
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          # Initialize baseline configuration parameters
          make O=out vili_defconfig
          
          # Inject the custom local version name directly into the build configurations
          sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-Next-Gen"/g' out/.config || echo 'CONFIG_LOCALVERSION="-Next-Gen"' >> out/.config
          
          # Inject core eBPF framework rules required for HyperOS AI tracking
          echo "CONFIG_BPF=y" >> out/.config
          echo "CONFIG_BPF_SYSCALL=y" >> out/.config
          echo "CONFIG_BPF_JIT=y" >> out/.config
          echo "CONFIG_BPF_JIT_ALWAYS_ON=y" >> out/.config
          echo "CONFIG_CGROUP_BPF=y" >> out/.config
          echo "CONFIG_NETFILTER_XT_MATCH_BPF=y" >> out/.config
          
          # Inject mandatory HyperOS security & file context system properties
          echo "CONFIG_TMPFS_XATTR=y" >> out/.config
          echo "CONFIG_EROFS_FS=y" >> out/.config
          echo "CONFIG_EROFS_FS_ZIP=y" >> out/.config
          echo "CONFIG_ANDROID_BINDERFS=y" >> out/.config
          
      - name: Compile Full Source (Kernel, DTBO, and Vendor Modules)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          # Compiles the core kernel alongside device-tree overlay blobs natively using LLVM tools
          make O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            -j$(nproc) dtbo.img modules Image.gz-dtb Image

      - name: Assemble Workspace Artifact Structures
        run: |
          mkdir out_artifacts
          
          # Grab Core Kernel Binaries
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb out_artifacts/boot.img
          else
            cp out/arch/arm64/boot/Image out_artifacts/boot.img
          fi
          
          # Grab Native Source-Compiled DTBO
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img out_artifacts/
          fi
          
          # Provision Mock Vendor Boot block profile to carry built modules
          echo "Creating Unified Source Build Components..." > out_artifacts/vendor_boot.img

      - name: Pack Everything via AnyKernel3 (HyperOS Partition Standard)
        run: |
          git clone https://github.com anykernel
          cd anykernel
          
          # Move Compiled source files directly into the installation target frame
          cp ../out_artifacts/boot.img ./Image
          [ -f ../out_artifacts/dtbo.img ] && cp ../out_artifacts/dtbo.img .
          
          cat << 'EOF' > anykernel.sh
          # AnyKernel3 Setup
          properties() { '
          kernel.string=Next-Gen Source HyperOS Unified Build for Xiaomi 11T Pro
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=vili
          device.name2=vili_global
          supported.versions=14 - 17
          '; }
          
          # HyperOS Partition Architecture Standard
          block=/dev/block/by-name/init_boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          
          split_boot;
          flash_boot;
          
          # Automatically flash compiled DTBO if generated from source tree
          if [ -f dtbo.img ]; then
            flash_generic dtbo;
          fi;
          EOF
          
          zip -r9 ../Next-Gen-HyperOS-Only-Kernel.zip * -x .git README.md

      - name: Save Complete Source Flashable Outputs
        uses: actions/upload-artifact@v4
        with:
          name: Next-Gen-HyperOS-Source-Package
          path: Next-Gen-HyperOS-Only-Kernel.zip
          
