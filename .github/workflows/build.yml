name: Build Xiaomi 11T Pro Safe HyperOS Kernel Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Fetch Compiler Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Fetch Kernel Source Code
        run: |
          rm -rf kernel
          git clone --depth=1 https://github.com/frenkymahn/Next-Gen.git kernel

      - name: Run Compilation Process
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          BUILD_FLAGS="ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 KCFLAGS=-Wno-error"
          
          make O=out $BUILD_FLAGS vili_defconfig
          make -j$(nproc --all) O=out $BUILD_FLAGS

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz anykernel/
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image anykernel/
          fi
          
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh
          sed -i 's|block=/dev/block/by-name/boot;|block=/dev/block/bootdevice/by-name/boot;|g' anykernel/anykernel.sh
          
          cd anykernel
          zip -r9 ../vili-NextGen-HyperOS-kernel.zip *

      - name: Upload Flashable Artifact Package
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-HyperOS-Kernel
          path: vili-NextGen-HyperOS-kernel.zip
