name: Build Xiaomi 11T Pro Custom Kernel

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Environment & Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libcrypto++-dev u-boot-tools git zip unzip libncurses5-dev ccache device-tree-compiler wget python3

      - name: Fetch Target AOSP Clang Toolchain
        run: |
          mkdir -p clang
          wget -O clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz || wget -O clang.tar.gz https://gitlab.com/LeLex09/aarch64-linux-android-droid-clang/-/raw/main/clang.tar.gz
          tar -C clang -xzf clang.tar.gz || true
          rm -f clang.tar.gz
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Checkout Device Kernel Tree
        uses: actions/checkout@v4
        with:
          path: kernel-source
          fetch-depth: 1
          
      - name: Apply Defconfig Parameters with BPF & HyperOS XATTR Support
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          # Initialize baseline configuration parameters
          make O=out vili_defconfig
          
          # Inject the custom local version name directly into the build configurations
          sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-Next-Gen"/g' out/.config || echo 'CONFIG_LOCALVERSION="-Next-Gen"' >> out/.config
          
          # Inject core eBPF framework rules for Android 11-17
          echo "CONFIG_BPF=y" >> out/.config
          echo "CONFIG_BPF_SYSCALL=y" >> out/.config
          echo "CONFIG_BPF_JIT=y" >> out/.config
          echo "CONFIG_BPF_JIT_ALWAYS_ON=y" >> out/.config
          echo "CONFIG_CGROUP_BPF=y" >> out/.config
          echo "CONFIG_NETFILTER_XT_MATCH_BPF=y" >> out/.config
          
          # Inject mandatory HyperOS/MIUI filesystem & security tracking parameters
          echo "CONFIG_TMPFS_XATTR=y" >> out/.config
          echo "CONFIG_EROFS_FS=y" >> out/.config
          echo "CONFIG_EROFS_FS_ZIP=y" >> out/.config
          echo "CONFIG_ANDROID_BINDERFS=y" >> out/.config
          
      - name: Compile Full Source (Kernel Image and Modules)
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          # Compiles core kernel Image and modules successfully without missing target errors
          make O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            -j$(nproc) modules Image dtbs

      - name: Assemble Workspace Artifact Structures
        run: |
          mkdir out_artifacts
          
          # Grab Core Uncompressed Kernel Binary (Image)
          if [ -f kernel-source/out/arch/arm64/boot/Image ]; then
            cp kernel-source/out/arch/arm64/boot/Image out_artifacts/boot.img
          else
            echo "Error: Kernel Image not found!"
            exit 1
          fi
          
          # Grab compiled DTBO if generated in output tree
          if [ -f kernel-source/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel-source/out/arch/arm64/boot/dtbo.img out_artifacts/
          fi
          
          echo "HyperOS Compatible Binaries Prepared..." > out_artifacts/status.txt

      - name: Pack Everything via AnyKernel3 for HyperOS/MIUI Flashing
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          
          # Move Compiled source files directly into the installation target frame
          cp ../out_artifacts/boot.img ./Image
          [ -f ../out_artifacts/dtbo.img ] && cp ../out_artifacts/dtbo.img .
          
          cat << 'EOF' > anykernel.sh
          # AnyKernel3 Setup for HyperOS & MIUI (Android 11 - 17)
          properties() { '
          kernel.string=Next-Gen HyperOS/MIUI Unified Build for Xiaomi 11T Pro
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=vili
          device.name2=vili_global
          supported.versions=11 - 17
          '; }
          
          # Dynamic partition standard matching HyperOS/MIUI architecture
          if [ -e /dev/block/by-name/init_boot ]; then
            block=/dev/block/by-name/init_boot;
            is_slot_device=1;
          else
            block=/dev/block/bootdevice/by-name/boot;
            is_slot_device=1;
          fi;
          
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          
          split_boot;
          flash_boot;
          
          # Automatically flash compiled DTBO to perfectly match HyperOS vendor tree
          if [ -f dtbo.img ]; then
            flash_generic dtbo;
          fi;
          EOF
          
          zip -r9 ../Next-Gen-HyperOS-MIUI-Kernel.zip * -x .git README.md

      - name: Save HyperOS/MIUI Flashable Outputs
        uses: actions/upload-artifact@v4
        with:
          name: Next-Gen-HyperOS-MIUI-Package
          path: Next-Gen-HyperOS-MIUI-Kernel.zip
          
