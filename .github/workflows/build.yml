name: Build Xiaomi 11T Pro Safe Boot Image (Next-Gen)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip device-tree-compiler

      - name: Fetch Clang Toolchain
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r487747c.git clang

      - name: Inject Xiaomi Official OSS Drivers & DTB
        run: |
          # Fetch official Xiaomi display and touch drivers
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # Pull official Xiaomi open-source techpack display & drivers
          git remote add xiaomi-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git || true
          git fetch xiaomi-oss vili-s-oss --depth=1 || true
          
          # Checkout display and hardware tree if missing
          git checkout xiaomi-oss/vili-s-oss -- techpack/display drivers/gpu/drm/msm 2>/dev/null || true

      - name: Run Compilation Process with Next-Gen Name
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          BUILD_FLAGS="ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 KCFLAGS=-Wno-error -Wno-unknown-warning-option -Wno-ignored-optimization-argument"
          
          make O=out $BUILD_FLAGS vili_defconfig

          # Set Kernel Name to Next-Gen
          scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-Next-Gen"

          # Permissive rules for Port ROM boot
          scripts/config --file out/.config --enable CONFIG_ALWAYS_PERMISSIVE
          scripts/config --file out/.config --disable CONFIG_SECURITY_SELINUX_DEVELOP

          # Compile Kernel, DTBs and DTBOs
          make -j$(nproc --all) O=out $BUILD_FLAGS
          make -j$(nproc --all) O=out $BUILD_FLAGS dtbs

      - name: Package Complete AnyKernel3 Flashable Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git

          # Copy Kernel Image
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/Image.gz
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image anykernel/Image
          fi

          # Extract and combine DTBs into anykernel
          find out/arch/arm64/boot/dts/vendor/qcom/ -name "*.dtb" -exec cat {} + > anykernel/dtb 2>/dev/null || true
          
          # Copy DTBO image if compiled
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img anykernel/dtbo.img
          fi

          cat << 'EOF' > anykernel/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=Next-Gen for FrenkyMahn
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=Xiaomi 11T Pro
          device.name2=milahaina
          device.name3=vili
          supported.versions=11 - 17
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh && passthrough;

          dump_boot;
          write_boot;
          EOF

          sed -i 's/^[ \t]*//' anykernel/anykernel.sh

          cd anykernel
          zip -r9 ../Xiaomi-11T-Pro-NextGen-OSS-Fixed.zip *

      - name: Upload Complete Next-Gen Flashable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-NextGen-OSS-Fixed
          path: Xiaomi-11T-Pro-NextGen-OSS-Fixed.zip
