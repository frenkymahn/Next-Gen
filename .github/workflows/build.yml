name: Build Xiaomi 11T Pro Safe HyperOS Kernel Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Fetch Compiler Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Fetch Kernel Source Code
        run: |
          rm -rf kernel
          git clone --depth=1 https://github.com/AOSP-for-vili/android_kernel_xiaomi_sm8350.git kernel

      - name: Inject Configurations & HyperOS Fixes
        run: |
          cd kernel
          DEFCONFIG_PATH="arch/arm64/configs/vili_user_defconfig"
          
          # Storage & Overlay support
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG_PATH
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG_PATH
          
          # Complete BPF & Security parameters (fixing verifier.c declaration error)
          echo "CONFIG_BPF_SYSCALL=y" >> $DEFCONFIG_PATH
          echo "CONFIG_BPF_JIT=y" >> $DEFCONFIG_PATH
          echo "CONFIG_BPF_JIT_ALWAYS_ON=y" >> $DEFCONFIG_PATH
          echo "CONFIG_HAVE_EBPF_JIT=y" >> $DEFCONFIG_PATH
          echo "CONFIG_NET_CLS_ACT=y" >> $DEFCONFIG_PATH
          echo "CONFIG_CGROUP_BPF=y" >> $DEFCONFIG_PATH
          echo "CONFIG_NETFILTER_XT_MATCH_BPF=y" >> $DEFCONFIG_PATH
          echo "CONFIG_SECURITY_SELINUX=y" >> $DEFCONFIG_PATH
          echo "CONFIG_CRYPTO_SHA256=y" >> $DEFCONFIG_PATH
          
          # Next-Gen version string
          if grep -q "CONFIG_LOCALVERSION=" "$DEFCONFIG_PATH"; then
            sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Next-Gen"/g' $DEFCONFIG_PATH
          else
            echo 'CONFIG_LOCALVERSION="-Next-Gen"' >> $DEFCONFIG_PATH
          fi
          echo "CONFIG_LOCALVERSION_AUTO=n" >> $DEFCONFIG_PATH

      - name: Run Compilation Process
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS=-Wno-error"
          
          make O=out $MAKE_ARGS vili_user_defconfig
          make -j$(nproc --all) O=out $MAKE_ARGS

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz anykernel/
          else
            cp kernel/out/arch/arm64/boot/Image anykernel/
          fi
          
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh
          sed -i 's|block=/dev/block/by-name/boot;|block=/dev/block/bootdevice/by-name/boot;|g' anykernel/anykernel.sh
          
          cd anykernel
          zip -r9 ../vili-NextGen-HyperOS-kernel.zip *

      - name: Upload Flashable Artifact Package
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-HyperOS-Kernel
          path: vili-NextGen-HyperOS-kernel.zip
