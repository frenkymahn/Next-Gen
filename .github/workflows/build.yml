name: Build Xiaomi 11T Pro Clean Kernel Package

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Environment & Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libcrypto++-dev u-boot-tools git zip unzip libncurses5-dev ccache device-tree-compiler wget python3 python3-pip

      - name: Fetch Target AOSP Clang Toolchain
        run: |
          mkdir -p clang
          wget -O clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz || wget -O clang.tar.gz https://gitlab.com/LeLex09/aarch64-linux-android-droid-clang/-/raw/main/clang.tar.gz
          tar -C clang -xzf clang.tar.gz || true
          rm -f clang.tar.gz
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Checkout Device Kernel Tree
        uses: actions/checkout@v4
        with:
          path: kernel-source
          fetch-depth: 1
          
      - name: Initialize Defconfig and Compile Kernel Image
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          # Clean old build
          make O=out clean || true
          rm -rf out
          
          # Use source default configuration directly without modifications
          make O=out vili_defconfig
          
          # Compile core Image and modules safely
          make O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            -j$(nproc) modules Image

      - name: Assemble Final Package
        run: |
          mkdir -p final_flashable_package
          
          if [ -f kernel-source/out/arch/arm64/boot/Image ]; then
            cp kernel-source/out/arch/arm64/boot/Image final_flashable_package/boot.img
          fi
          
          # Staging compiled modules
          mkdir -p module_staging
          make -C kernel-source O=out INSTALL_MOD_PATH=../../module_staging INSTALL_MOD_STRIP=1 modules_install
          
          if [ -d module_staging/lib/modules ]; then
            cp -r module_staging/lib/modules final_flashable_package/
          fi
          
          cd final_flashable_package
          zip -r9 ../Xiaomi-11T-Pro-Clean-Package.zip *
          cd ..

      - name: Upload Final Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-Clean-Package
          path: Xiaomi-11T-Pro-Clean-Package.zip
