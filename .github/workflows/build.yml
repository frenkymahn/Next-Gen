name: Build Xiaomi 11T Pro Kernel with DTBO & Modules

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Environment & Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libcrypto++-dev u-boot-tools git zip unzip libncurses5-dev ccache device-tree-compiler wget python3 python3-pip

      - name: Fetch Target AOSP Clang Toolchain
        run: |
          mkdir -p clang
          wget -O clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz || wget -O clang.tar.gz https://gitlab.com/LeLex09/aarch64-linux-android-droid-clang/-/raw/main/clang.tar.gz
          tar -C clang -xzf clang.tar.gz || true
          rm -f clang.tar.gz
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Checkout Device Kernel Tree
        uses: actions/checkout@v4
        with:
          path: kernel-source
          fetch-depth: 1
          
      - name: Initialize Defconfig and Compile Core Targets with DTBO
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          make O=out clean || true
          rm -rf out
          
          make O=out vili_defconfig
          
          # Compile Image, dtbo.img and modules safely
          make O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            -j$(nproc) modules Image dtbo.img

      - name: Stage Compiled Binaries, DTBO and Modules
        run: |
          mkdir -p compiled_output
          
          # 1. Kernel Image (boot.img)
          if [ -f kernel-source/out/arch/arm64/boot/Image ]; then
            cp kernel-source/out/arch/arm64/boot/Image compiled_output/Image
          fi
          
          # 2. DTBO Image
          if [ -f kernel-source/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel-source/out/arch/arm64/boot/dtbo.img compiled_output/dtbo.img
          fi
          
          # 3. Modules Staging
          mkdir -p module_staging
          make -C kernel-source O=out INSTALL_MOD_PATH=../../module_staging INSTALL_MOD_STRIP=1 modules_install

      - name: Pack Everything into AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          
          # Copy binaries into AnyKernel structure
          cp ../compiled_output/Image ./Image
          if [ -f ../compiled_output/dtbo.img ]; then
            cp ../compiled_output/dtbo.img ./dtbo.img
          fi
          
          # Copy modules if generated
          if [ -d ../module_staging/lib/modules ]; then
            mkdir -p ./modules/system/lib/modules
            cp -r ../module_staging/lib/modules/* ./modules/system/lib/modules/ 2>/dev/null || true
          fi
          
          # Custom AnyKernel script to flash boot, dtbo and modules explicitly to Slot A
          cat << 'EOF' > anykernel.sh
          # AnyKernel3 Framework for Xiaomi 11T Pro (vili) - Boot & DTBO Flashing
          properties() { '
          kernel.string=Xiaomi 11T Pro HyperOS Custom Kernel with DTBO
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=vili
          device.name2=vili_global
          supported.versions=11 - 17
          '; }
          
          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          
          # Flash Boot Image to Slot A
          split_boot;
          flash_boot;
          
          # Flash DTBO to Slot A if present in zip
          if [ -f dtbo.img ]; then
            block=dtbo;
            flash_generic dtbo.img;
          fi;
          
          # Install modules
          di_modules;
          EOF
          
          zip -r9 ../Xiaomi-11T-Pro-HyperOS-Kernel-DTBO.zip * -x .git README.md

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-HyperOS-Kernel-DTBO
          path: Xiaomi-11T-Pro-HyperOS-Kernel-DTBO.zip
          
