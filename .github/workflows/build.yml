name: Build Xiaomi 11T Pro Final Complete Package

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Environment & Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libcrypto++-dev u-boot-tools git zip unzip libncurses5-dev ccache device-tree-compiler wget python3 python3-pip android-tools-fsutils

      - name: Fetch Target AOSP Clang Toolchain
        run: |
          mkdir -p clang
          wget -O clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz || wget -O clang.tar.gz https://gitlab.com/LeLex09/aarch64-linux-android-droid-clang/-/raw/main/clang.tar.gz
          tar -C clang -xzf clang.tar.gz || true
          rm -f clang.tar.gz
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Checkout Device Kernel Tree
        uses: actions/checkout@v4
        with:
          path: kernel-source
          fetch-depth: 1
          
      - name: Apply HyperOS Defconfig Parameters & Clean Build
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          make O=out clean || true
          rm -rf out
          
          make O=out vili_defconfig
          
          # Force set local version and strict HyperOS boot properties
          sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-HyperOS-Vili"/g' out/.config || echo 'CONFIG_LOCALVERSION="-HyperOS-Vili"' >> out/.config
          sed -i 's/CONFIG_CMDLINE_FROM_BOOTLOADER=y/# CONFIG_CMDLINE_FROM_BOOTLOADER is not set/g' out/.config
          echo "CONFIG_CMDLINE_EXTEND=y" >> out/.config
          
          # Essential HyperOS features & BPF/Binder support
          echo "CONFIG_BPF=y" >> out/.config
          echo "CONFIG_BPF_SYSCALL=y" >> out/.config
          echo "CONFIG_BPF_JIT=y" >> out/.config
          echo "CONFIG_BPF_JIT_ALWAYS_ON=y" >> out/.config
          echo "CONFIG_CGROUP_BPF=y" >> out/.config
          echo "CONFIG_NETFILTER_XT_MATCH_BPF=y" >> out/.config
          echo "CONFIG_TMPFS_XATTR=y" >> out/.config
          echo "CONFIG_EROFS_FS=y" >> out/.config
          echo "CONFIG_EROFS_FS_ZIP=y" >> out/.config
          echo "CONFIG_ANDROID_BINDERFS=y" >> out/.config
          
      - name: Compile Kernel Image, DTB, DTBO and Modules Safely
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          make O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            -j$(nproc) modules Image dtbs dtbo.img

      - name: Assemble All Four Essential Images into a Single Package
        run: |
          mkdir -p final_flashable_package
          
          # 1. Boot Image (Kernel Image)
          if [ -f kernel-source/out/arch/arm64/boot/Image ]; then
            cp kernel-source/out/arch/arm64/boot/Image final_flashable_package/boot.img
          fi
          
          # 2. DTB Image
          if [ -f kernel-source/out/arch/arm64/boot/dts/qcom/vili.dtb ]; then
            cp kernel-source/out/arch/arm64/boot/dts/qcom/vili.dtb final_flashable_package/dtb
          elif [ -f kernel-source/out/arch/arm64/boot/dtb ]; then
            cp kernel-source/out/arch/arm64/boot/dtb final_flashable_package/dtb
          fi
          
          # 3. DTBO Image
          if [ -f kernel-source/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel-source/out/arch/arm64/boot/dtbo.img final_flashable_package/dtbo.img
          fi
          
          # 4. Compile and stage kernel modules for vendor_boot integration
          mkdir -p module_staging
          make -C kernel-source O=out INSTALL_MOD_PATH=../../module_staging INSTALL_MOD_STRIP=1 modules_install
          
          # Copy modules archive into final package folder for complete flashing support
          if [ -d module_staging/lib/modules ]; then
            cp -r module_staging/lib/modules final_flashable_package/
          fi
          
          # Create a clear instruction file for flashing order
          cat << 'EOF' > final_flashable_package/FLASH_INSTRUCTIONS.txt
          Xiaomi 11T Pro (vili) - HyperOS Custom Kernel Package
          Flash order via Fastboot:
          1. fastboot flash boot boot.img
          2. fastboot flash dtb dtb
          3. fastboot flash dtbo dtbo.img
          4. fastboot flash vendor_boot vendor_boot.img (if repacked with new modules)
          EOF
          
          cd final_flashable_package
          zip -r9 ../Xiaomi-11T-Pro-HyperOS-Final-Package.zip *
          cd ..

      - name: Upload Final Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-HyperOS-Final-Package
          path: Xiaomi-11T-Pro-HyperOS-Final-Package.zip
          
