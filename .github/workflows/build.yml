name: Build Xiaomi 11T Pro Safe HyperOS Kernel Package

on:
  workflow_dispatch:
    inputs:
      stock_boot_url:
        description: "Direct URL to stock HyperOS boot.img (Optional: leave blank to skip repacking full partition images)"
        required: false
        default: ""
      stock_vendor_boot_url:
        description: "Direct URL to stock HyperOS vendor_boot.img (Optional: leave blank to skip repacking full partition images)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex git gnupg gperf libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip device-tree-compiler

      - name: Fetch Compiler Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Fetch Kernel Source Code
        run: |
          rm -rf kernel
          git clone --depth=1 https://github.com/frenkymahn/Next-Gen.git kernel

      - name: Run Compilation Process (Kernel & DTBs)
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          BUILD_FLAGS="ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 KCFLAGS=-Wno-error -Wno-unknown-warning-option -Wno-ignored-optimization-argument"
          
          make O=out $BUILD_FLAGS vili_defconfig
          make -j$(nproc --all) O=out $BUILD_FLAGS dtbs

      - name: Build DTBO Image & Concatenate DTB
        run: |
          mkdir -p tools/libufdt work_images
          git clone --depth=1 https://android.googlesource.com/platform/system/libufdt tools/libufdt

          # 1. Combine all compiled dts blobs into dtb
          find kernel/out/arch/arm64/boot/dts -name "*.dtb" -exec cat {} + > work_images/dtb

          # 2. Package dtbo.img from all compiled dtbo files
          DTBO_FILES=$(find kernel/out/arch/arm64/boot/dts -name "*.dtbo" | sort)
          if [ -n "$DTBO_FILES" ]; then
            python3 tools/libufdt/utils/src/mkdtboimg.py create work_images/dtbo.img $DTBO_FILES
          elif [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img work_images/dtbo.img
          fi

      - name: Repack Standalone boot.img and vendor_boot.img
        run: |
          if [ -n "${{ github.event.inputs.stock_boot_url }}" ] && [ -n "${{ github.event.inputs.stock_vendor_boot_url }}" ]; then
            wget -qO magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
            unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
            chmod +x magiskboot

            curl -sL "${{ github.event.inputs.stock_boot_url }}" -o stock_boot.img
            curl -sL "${{ github.event.inputs.stock_vendor_boot_url }}" -o stock_vendor_boot.img

            if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
              KERNEL_BIN="kernel/out/arch/arm64/boot/Image.gz"
            else
              KERNEL_BIN="kernel/out/arch/arm64/boot/Image"
            fi

            # Repack boot.img
            mkdir -p work_boot && cd work_boot
            ../magiskboot unpack ../stock_boot.img
            cp ../$KERNEL_BIN kernel
            ../magiskboot repack ../stock_boot.img ../work_images/boot.img
            cd ..

            # Repack vendor_boot.img with new dtb
            mkdir -p work_vendor && cd work_vendor
            ../magiskboot unpack ../stock_vendor_boot.img
            [ -f ../work_images/dtb ] && cp ../work_images/dtb dtb
            ../magiskboot repack ../stock_vendor_boot.img ../work_images/vendor_boot.img
            cd ..
          fi

      - name: Package Everything into Single AnyKernel3 ZIP
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git

          # Copy Kernel Image
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz anykernel/
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image anykernel/
          fi

          # Copy DTB, DTBO, and repacked partition images into root of zip
          [ -f work_images/dtb ] && cp work_images/dtb anykernel/
          [ -f work_images/dtbo.img ] && cp work_images/dtbo.img anykernel/
          [ -f work_images/boot.img ] && cp work_images/boot.img anykernel/
          [ -f work_images/vendor_boot.img ] && cp work_images/vendor_boot.img anykernel/

          # Configure AnyKernel3 for Xiaomi 11T Pro HyperOS
          sed -i 's/kernel.string=.*/kernel.string=Next-Gen Kernel for Xiaomi 11T Pro (HyperOS)/g' anykernel/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh
          sed -i 's/do.modules=0/do.modules=0/g' anykernel/anykernel.sh
          sed -i 's/do.cleanup=1/do.cleanup=1/g' anykernel/anykernel.sh
          sed -i 's/do.cleanuponabort=0/do.cleanuponabort=0/g' anykernel/anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=1/g' anykernel/anykernel.sh
          sed -i 's|block=/dev/block/by-name/boot;|block=/dev/block/bootdevice/by-name/boot;|g' anykernel/anykernel.sh

          cd anykernel
          zip -r9 ../Xiaomi-11T-Pro-NextGen-AllInOne.zip *

      - name: Upload Complete Kernel & Partition Package
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-NextGen-Package
          path: Xiaomi-11T-Pro-NextGen-AllInOne.zip
