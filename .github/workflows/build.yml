name: Build Xiaomi 11T Pro Safe HyperOS Kernel Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Fetch Compiler Toolchain (AOSP Clang r450784d)
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r450784d.git clang

      - name: Fetch Kernel Source Code
        run: |
          rm -rf kernel
          git clone https://github.com/frenkymahn/Next-Gen_ViLi_kernel.git --depth=1 kernel

      - name: Inject Configurations & HyperOS Fixes
        run: |
          cd kernel
          DEFCONFIG_PATH="arch/arm64/configs/vili_user_defconfig"
          
          # 1. Overlay & FS configs
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG_PATH
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG_PATH
          
          # 2. Crucial eBPF & Security parameters required for MIUI / HyperOS Boot
          echo "CONFIG_BPF_SYSCALL=y" >> $DEFCONFIG_PATH
          echo "CONFIG_NET_CLS_ACT=y" >> $DEFCONFIG_PATH
          echo "CONFIG_CGROUP_BPF=y" >> $DEFCONFIG_PATH
          echo "CONFIG_NETFILTER_XT_MATCH_BPF=y" >> $DEFCONFIG_PATH
          echo "CONFIG_SECURITY_SELINUX=y" >> $DEFCONFIG_PATH
          echo "CONFIG_CRYPTO_SHA256=y" >> $DEFCONFIG_PATH
          
          # 3. Assign Next-Gen identity signature
          if grep -q "CONFIG_LOCALVERSION=" "$DEFCONFIG_PATH"; then
            sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Next-Gen"/g' $DEFCONFIG_PATH
          else
            echo 'CONFIG_LOCALVERSION="-Next-Gen"' >> $DEFCONFIG_PATH
          fi
          echo "CONFIG_LOCALVERSION_AUTO=n" >> $DEFCONFIG_PATH

      - name: Run Compilation Process
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          
          make O=out vili_user_defconfig
          make -j$(nproc --all) O=out CC=clang LD=ld.lld

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git
          
          # Select matching output binary target
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz anykernel/
          else
            cp kernel/out/arch/arm64/boot/Image anykernel/
          fi
          
          # Format block partition mapping locations for vili UFS architecture
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh
          sed -i 's|block=/dev/block/by-name/boot;|block=/dev/block/bootdevice/by-name/boot;|g' anykernel/anykernel.sh
          
          cd anykernel
          zip -r9 ../vili-NextGen-HyperOS-kernel.zip *

      - name: Upload Flashable Artifact Package
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-HyperOS-Kernel
          path: vili-NextGen-HyperOS-kernel.zip
