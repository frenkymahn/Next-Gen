name: Build Xiaomi 11T Pro HyperOS Kernel (Slot A)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Clean Environment & Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libcrypto++-dev u-boot-tools git zip unzip libncurses5-dev ccache device-tree-compiler wget python3

      - name: Fetch Target AOSP Clang Toolchain
        run: |
          mkdir -p clang
          wget -O clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz || wget -O clang.tar.gz https://gitlab.com/LeLex09/aarch64-linux-android-droid-clang/-/raw/main/clang.tar.gz
          tar -C clang -xzf clang.tar.gz || true
          rm -f clang.tar.gz
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Checkout Device Kernel Tree
        uses: actions/checkout@v4
        with:
          path: kernel-source
          fetch-depth: 1
          
      - name: Apply HyperOS Defconfig Parameters & Clean Build
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          # Clean old build cache
          make O=out clean || true
          rm -rf out
          
          # Initialize baseline configuration parameters
          make O=out vili_defconfig
          
          # Force set local version and strict HyperOS boot properties
          sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-HyperOS-Vili"/g' out/.config || echo 'CONFIG_LOCALVERSION="-HyperOS-Vili"' >> out/.config
          sed -i 's/CONFIG_CMDLINE_FROM_BOOTLOADER=y/# CONFIG_CMDLINE_FROM_BOOTLOADER is not set/g' out/.config
          echo "CONFIG_CMDLINE_EXTEND=y" >> out/.config
          
          # HyperOS specific essential filesystem & binder flags
          echo "CONFIG_BPF=y" >> out/.config
          echo "CONFIG_BPF_SYSCALL=y" >> out/.config
          echo "CONFIG_BPF_JIT=y" >> out/.config
          echo "CONFIG_BPF_JIT_ALWAYS_ON=y" >> out/.config
          echo "CONFIG_CGROUP_BPF=y" >> out/.config
          echo "CONFIG_NETFILTER_XT_MATCH_BPF=y" >> out/.config
          echo "CONFIG_TMPFS_XATTR=y" >> out/.config
          echo "CONFIG_EROFS_FS=y" >> out/.config
          echo "CONFIG_EROFS_FS_ZIP=y" >> out/.config
          echo "CONFIG_ANDROID_BINDERFS=y" >> out/.config
          
      - name: Compile HyperOS Kernel Image and Modules
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          make O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            -j$(nproc) modules Image dtbs

      - name: Assemble Workspace Artifact Structures
        run: |
          mkdir out_artifacts
          
          if [ -f kernel-source/out/arch/arm64/boot/Image ]; then
            cp kernel-source/out/arch/arm64/boot/Image out_artifacts/boot.img
          else
            echo "Error: Kernel Image not found!"
            exit 1
          fi
          
          if [ -f kernel-source/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel-source/out/arch/arm64/boot/dtbo.img out_artifacts/
          fi
          
          echo "HyperOS Binaries Ready..." > out_artifacts/status.txt

      - name: Pack via AnyKernel3 (Forced Slot A Target)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          
          cp ../out_artifacts/boot.img ./Image
          [ -f ../out_artifacts/dtbo.img ] && cp ../out_artifacts/dtbo.img .
          
          cat << 'EOF' > anykernel.sh
          # AnyKernel3 Setup for HyperOS (Xiaomi 11T Pro - vili) - Forced Slot A Flashing
          properties() { '
          kernel.string=HyperOS Slot-A Exclusive Build for Xiaomi 11T Pro
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=vili
          device.name2=vili_global
          supported.versions=11 - 17
          '; }
          
          # Forcefully target Slot A partitions explicitly
          block=/dev/block/bootdevice/by-name/boot_a;
          is_slot_device=0;
          
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          
          # Flash boot to Slot A directly
          if [ -e /dev/block/bootdevice/by-name/boot_a ]; then
            flash_raw /dev/block/bootdevice/by-name/boot_a Image;
          else
            block=boot;
            is_slot_device=1;
            SLOT=_a;
            split_boot;
            flash_boot;
          fi;
          
          # Flash dtbo to Slot A directly if present
          if [ -f dtbo.img ]; then
            if [ -e /dev/block/bootdevice/by-name/dtbo_a ]; then
              flash_raw /dev/block/bootdevice/by-name/dtbo_a dtbo.img;
            else
              flash_generic dtbo;
            fi;
          fi;
          EOF
          
          zip -r9 ../HyperOS-Vili-Kernel-SlotA.zip * -x .git README.md

      - name: Upload HyperOS Kernel Package
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Vili-Kernel-SlotA
          path: HyperOS-Vili-Kernel-SlotA.zip
